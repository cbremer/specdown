name: Bump version on merge

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keep the existing required check name. Version changes now go through a
  # normal PR; this workflow cannot bypass review or merge its own proposal.
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push'
        with:
          node-version: '22'
      - name: Classify the reviewed commit
        id: policy
        if: github.event_name == 'push'
        run: node scripts/release-policy.js classify
      - name: Prepare version proposal without npm lifecycle scripts
        if: steps.policy.outputs.action == 'prepare'
        run: |
          npm version patch --ignore-scripts --no-git-tag-version
          node scripts/sync-version.js
          node scripts/generate-changelog.js
      - name: Open normal version PR
        if: steps.policy.outputs.action == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="codex/version-bump-${VERSION}-${GITHUB_SHA:0:12}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- package.json package-lock.json markdown-viewer/src/main.js CHANGELOG.md
          git commit -m "chore: prepare v${VERSION} release"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: prepare v${VERSION} release" --body 'Generated version-only proposal. Required checks and independent review must pass before rebase merging. This automation does not merge or bypass branch protection.'
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run version-bump.yml --ref "$BRANCH"
      - name: Create immutable tag for a reviewed version-only commit
        if: steps.policy.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$EXISTING" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || { echo 'Release tag already belongs to another commit'; exit 1; }
          else
            git tag "$TAG" "$GITHUB_SHA"
            gh auth setup-git
            git push origin "refs/tags/$TAG"
          fi
          node scripts/generate-changelog.js --latest > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          echo 'Draft release created. Desktop signing/publication requires the protected release workflow; Apple uploads remain manual.'
