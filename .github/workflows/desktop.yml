name: Build Desktop App

# Dispatch the reviewed workflow on main and choose an immutable release tag.
# Preview is unsigned and artifact-only. Publication requires a protected
# desktop-release environment with independent approval (see release docs).
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Exact existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      validate-only:
        description: Build unsigned preview artifacts without signing or publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  provenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Resolve reviewed tag to immutable source
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/release-policy.js resolve
      - name: Require independently protected release environment
        if: ${{ !inputs.validate-only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-environment.js desktop-release

  build:
    needs: provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac dmg zip --universal
          - os: windows-latest
            platform: win
            args: --win nsis
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    # An unprotected preview environment receives no signing secrets.
    environment: ${{ inputs.validate-only && 'desktop-preview' || 'desktop-release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.provenance.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: |
          npm run lint
          npm run typecheck
          npm run test:ci
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev libdrm-dev libxkbcommon-dev libgbm-dev
      - name: Build unsigned preview or non-macOS installer
        if: inputs.validate-only || matrix.platform != 'mac'
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build -- $BUILD_ARGS --publish never
      - name: Build signed and notarized macOS release
        if: ${{ !inputs.validate-only && matrix.platform == 'mac' }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo 'Signing configuration is incomplete; release stopped'; exit 1; }
          npm run desktop:build -- --mac dmg zip --universal -c.mac.notarize=true --publish never
          codesign --verify --deep --strict 'dist/mac-universal/Specdown Desktop.app'
          spctl --assess --type execute 'dist/mac-universal/Specdown Desktop.app'
      - name: Verify macOS icon and associations
        if: matrix.platform == 'mac'
        run: |
          python3 scripts/test-macos-icon.py
          python3 scripts/macos-icon.py verify 'dist/mac-universal/Specdown Desktop.app'
      - name: Store exact build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.provenance.outputs.sha }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  publish:
    if: ${{ !inputs.validate-only }}
    needs: [provenance, build]
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      actions: read
    steps:
      # No dependency install, source scripts, or app build executes in this job.
      - name: Download this run's verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.provenance.outputs.sha }}
        run: gh run download "$GITHUB_RUN_ID" --pattern "desktop-*-$RELEASE_SHA" --dir artifacts
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.provenance.outputs.tag }}
          RELEASE_SHA: ${{ needs.provenance.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          TAG_SHA=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          TAG_TYPE=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.type)
          if [ "$TAG_TYPE" = tag ]; then
            TAG_SHA=$(gh api "repos/$GH_REPO/git/tags/$TAG_SHA" --jq .object.sha)
          fi
          test "$TAG_SHA" = "$RELEASE_SHA" || { echo 'Release tag changed since validation'; exit 1; }
          gh release view "$RELEASE_TAG" >/dev/null
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite an already published release'; exit 1; }
          test -f "artifacts/desktop-mac-$RELEASE_SHA/latest-mac.yml"
          mapfile -d '' FILES < <(find artifacts -type f -print0)
          test "${#FILES[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
