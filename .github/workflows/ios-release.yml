name: iOS Release Validation

# Validation only. Ordinary web/direct-desktop releases must never authenticate
# to Apple or upload an iOS candidate. Store signing and upload remain a separate
# owner-led handoff after exact versions, build numbers and device QA are checked.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate iOS Release (unsigned simulator)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determine source versions
        id: version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('ios/project.yml', 'utf8');
          const versions = [...source.matchAll(/^\s*MARKETING_VERSION: "(\d+\.\d+(?:\.\d+)?)"\s*$/gm)];
          const webVersion = require('./package.json').version;
          const patch = /^0\.0\.([1-9]\d*)$/.exec(webVersion);
          if (versions.length !== 1 || !patch) {
            throw new Error('Expected one iOS marketing version and a positive 0.0.x web patch version');
          }
          const marketing = versions[0][1];
          const build = patch[1];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `marketing=${marketing}\nbuild=${build}\n`);
          console.log(`Validation only: iOS ${marketing} (${build}), shared viewer ${webVersion}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate Release build
        env:
          IOS_MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/SpecDown.xcodeproj \
            -scheme SpecDown \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/specdown-ios-release" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            build 2>&1 | tee "$RUNNER_TEMP/specdown-ios-release.log"
          app="$RUNNER_TEMP/specdown-ios-release/Build/Products/Release-iphonesimulator/Specdown.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$IOS_MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$IOS_BUILD_NUMBER"
          test -f "$app/dist/index.html"
          diff -qr markdown-viewer/dist "$app/dist"
          echo 'Unsigned simulator validation passed; no archive, upload, or device validation performed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve raw build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-validation-log
          path: ${{ runner.temp }}/specdown-ios-release.log
          if-no-files-found: ignore
          retention-days: 14
