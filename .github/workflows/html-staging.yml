name: HTML staging

# HTML-on web artifact for reviewers. Runs on the `html` integration
# branch only — never version-bumps, never calls desktop.yml / static.yml,
# never attaches to a GitHub Release or latest*.yml.
on:
  push:
    branches: [html]
  pull_request:
    branches: [html]
  workflow_dispatch:

# Limit GITHUB_TOKEN: checkout + npm, and upload-artifact only.
# Do not grant contents:write (this workflow must not version-bump
# or push to main).
permissions:
  contents: read
  actions: write

jobs:
  html-staging:
    name: HTML-on web artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (flag off)
        run: npm run test:ci

      - name: Build HTML-on dist
        run: npm run build:html

      - name: Upload html-staging-web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: html-staging-web
          path: markdown-viewer/dist
