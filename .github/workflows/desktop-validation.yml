name: Desktop Package Validation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/**'
      - 'markdown-viewer/**'
      - 'vite.config.js'
      - 'scripts/copy-static.js'
      - 'scripts/build-mac-reader.js'
      - 'ios/SpecDown/AppleIntelligenceServices.swift'
      - 'electron-builder*.js'
      - 'scripts/patch-macos-keychain.js'
      - 'scripts/test-desktop-watchers.js'
      - '.github/workflows/desktop-validation.yml'

# Compatibility checks have no release, signing or environment authority.
permissions:
  contents: read

concurrency:
  group: desktop-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    name: Unsigned package (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            args: --mac dir --universal
          - os: windows-latest
            platform: Windows
            args: --win nsis
          - os: ubuntu-latest
            platform: Linux
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.22.0 <23'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Test real desktop file watchers
        run: npm run test:watchers
      - name: Build unsigned package
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build -- $BUILD_ARGS --publish never
      - name: Check the bundled Mac reader
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper='dist/mac-universal/Specdown Desktop.app/Contents/Helpers/SpecDownReader'
          lipo "$helper" -verify_arch arm64 x86_64
          node - "$helper" <<'JS'
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const data = { requestId: 'ci.discovery' };
          const reply = JSON.parse(execFileSync(process.argv[2], [], {
            input: JSON.stringify({ action: 'explainAvailable', data }) + '\n',
            encoding: 'utf8', timeout: 15000,
          }));
          assert.equal(reply.requestId, data.requestId);
          assert.equal(typeof reply.result.available, 'boolean');
          if (!reply.result.available) assert.ok(reply.result.reason);
          JS
