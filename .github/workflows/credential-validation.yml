name: Validate desktop release credentials

# This is an explicitly approved credential check, never an app/release build.
# Environment placement is independently checked through the names-only API.
on:
  workflow_dispatch:
    inputs:
      verify-scope-only:
        description: Check approval policy and broad-scope absence without using credentials
        type: boolean
        default: false
      require-environment-only:
        description: Fail if signing secrets remain available outside desktop-release
        type: boolean
        default: true
      check-notarization:
        description: Make one read-only Apple notarization authentication request (no upload)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-credential-validation
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.22.0 <23'
      - name: Verify the existing personal release approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-environment.js desktop-release repository-owner
      - name: Check broad-scope availability without receiving secret values
        env:
          REQUIRE_ENVIRONMENT_ONLY: ${{ inputs.require-environment-only }}
          HAS_MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 != '' }}
          HAS_MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: python3 scripts/validate-desktop-credentials.py --scope-only

  credentials:
    needs: preflight
    if: github.ref == 'refs/heads/main' && !inputs.verify-scope-only
    runs-on: macos-latest
    timeout-minutes: 10
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify existing Developer ID identity in a disposable keychain
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CHECK_NOTARIZATION: ${{ inputs.check-notarization }}
        run: python3 scripts/validate-desktop-credentials.py
