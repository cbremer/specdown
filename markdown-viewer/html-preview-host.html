<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
    Preview host for sandboxed HTML documents. This page has its own CSP
    (Faithful: scripts may be inline / https). Parent CSP is NOT inherited
    because this is a real URL, not a blob or srcdoc document. The host
    script is this page's 'self' — never inlined into attacker HTML.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecDown HTML preview</title>
  </head>
  <body>
    <script src="./html-preview-host.js"></script>
  </body>
</html>
