<!-- @dsCard group="iOS" height=120 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div
      class="ios-action-bar"
      style="margin-top: 20px; position: static; display: grid"
    >
      <button class="ios-action-button active">
        <span class="ios-action-icon"
          ><svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" /></svg></span
        ><span class="ios-action-label">Contents</span>
      </button>
      <button class="ios-action-button">
        <span class="ios-action-icon"
          ><svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" /></svg></span
        ><span class="ios-action-label">Raw</span>
      </button>
      <button class="ios-action-button">
        <span class="ios-action-icon"
          ><svg
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" /></svg></span
        ><span class="ios-action-label">Find</span>
      </button>
      <button class="ios-action-button">
        <span class="ios-action-icon">&#8943;</span
        ><span class="ios-action-label">More</span>
      </button>
    </div>
  </body>
</html>
