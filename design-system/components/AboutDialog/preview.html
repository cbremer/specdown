<!-- @dsCard group="Dialogs · shared Modal" height=420 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
      .stage {
        position: relative;
        overflow: hidden;
      }
      .stage > * {
        position: absolute !important;
      }
    </style>
  </head>
  <body>
    <div class="stage" style="height: 340px">
      <div class="sd-scrim shortcuts-overlay" style="inset: 0">
        <div
          class="sd-modal sd-modal--sm about-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="t"
        >
          <div class="sd-modal-header">
            <h2 class="sd-modal-title" id="t">SpecDown</h2>
            <button class="sd-modal-close" aria-label="Close">
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <div class="sd-modal-body">
            <p class="about-tagline">
              A Markdown viewer with live Mermaid diagrams.
            </p>
            <p class="about-version">Version 1.42.0</p>
            <ul class="about-links">
              <li><a href="#">Support</a></li>
              <li><a href="#">Privacy Policy</a></li>
              <li><a href="#">Source code</a></li>
            </ul>
          </div>
          <div class="sd-modal-footer">
            <button class="sd-button about-done">Done</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
