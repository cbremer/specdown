<!-- @dsCard group="Dialogs · shared Modal" height=340 -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
      .stage {
        position: relative;
        overflow: hidden;
      }
      .stage > * {
        position: absolute !important;
      }
    </style>
  </head>
  <body>
    <div class="stage" style="height: 340px">
      <div class="sd-scrim shortcuts-overlay" style="inset: 0">
        <div
          class="sd-modal sd-modal--sm shortcuts-sheet"
          role="dialog"
          aria-modal="true"
          aria-labelledby="t"
        >
          <div class="sd-modal-header">
            <h2 class="sd-modal-title" id="t">Keyboard shortcuts</h2>
            <button class="sd-modal-close" aria-label="Close">
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
          <div class="sd-modal-body">
            <dl class="shortcuts-list">
              <div class="shortcuts-row">
                <dt><kbd>⌘ K</kbd></dt>
                <dd>Open command palette</dd>
              </div>
              <div class="shortcuts-row">
                <dt><kbd>⌘ F</kbd></dt>
                <dd>Find in document</dd>
              </div>
              <div class="shortcuts-row">
                <dt><kbd>⌘ D</kbd></dt>
                <dd>Bookmark this file</dd>
              </div>
              <div class="shortcuts-row">
                <dt><kbd>?</kbd></dt>
                <dd>Show this shortcuts sheet</dd>
              </div>
            </dl>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
