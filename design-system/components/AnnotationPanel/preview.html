<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
      .stage {
        position: relative;
        overflow: hidden;
      }
      .stage > * {
        position: absolute !important;
      }
    </style>
  </head>
  <body>
    <div class="stage" style="height: 300px">
      <div style="inset: 0; display: flex">
        <div
          style="
            flex: 1;
            background: var(--bg-primary);
            padding: 24px;
            color: var(--text-secondary);
          "
        >
          Document…
        </div>
        <aside class="sd-rail">
          <div class="sd-rail-header">
            <div class="sd-rail-tabs" role="tablist" aria-label="Document details">
              <button class="sd-rail-tab" role="tab" aria-selected="false">Explain</button>
              <button class="sd-rail-tab" role="tab" aria-selected="true">Notes <span class="sd-rail-tab-count">2</span></button>
            </div>
            <button class="sd-rail-close" aria-label="Close">✕</button>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0.5rem">
            <li class="annotation-list-item">
              <div class="annotation-list-context">
                “DOMPurify drops HTML comments…”
              </div>
              <div class="annotation-list-note">
                Check the sanitizer keeps these.
              </div>
            </li>
            <li class="annotation-list-item">
              <div class="annotation-list-context">
                “Native shells ignore prompt()”
              </div>
              <div class="annotation-list-note">Link to the toast docs.</div>
            </li>
          </ul>
        </aside>
      </div>
    </div>
  </body>
</html>
